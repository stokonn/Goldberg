name: Goldberg quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up required Android SDK packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build, JVM tests, instrumentation compilation and lint
        run: ./gradlew clean assembleDebug testDebugUnitTest assembleDebugAndroidTest lintDebug --no-daemon --max-workers=1
      - name: Host data and policy checks
        run: |
          python3 scripts/check_migrations.py
          python3 scripts/check_backup_fixtures.py
          python3 docs/planning/goldberg-0.11/stage-3b/check_fixtures.py
          python3 scripts/check_localization.py
          python3 scripts/check_history_paging.py
          python3 scripts/check_agent_policy.py
          python3 -m unittest discover -s scripts/stage6 -p 'test_backup_store.py'
          python3 scripts/stage6/verify_evidence.py
          git diff --exit-code -- app/schemas
# This workflow never publishes APKs signed with a runner-generated key.
# Emulator/UI/upgrade/signing acceptance and compatible release publication follow AGENTS.md.
