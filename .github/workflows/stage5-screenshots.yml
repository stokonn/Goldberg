name: Goldberg Stage 5 screenshot capture (both themes)
# Purpose-built, dispatch-only job for the two remaining Stage 5 acceptance
# artifacts that the main stage5-emulator.yml deliberately does not cover
# (owner-approved 2026-10-21): UI screenshots of the installed candidate in
# BOTH themes (Ivory = theme "Light", Nocturne = theme "Dark") on the same
# API 36 emulator configuration that produced the green verification runs.
#
# Safety / policy (identical rules to stage5-emulator.yml):
#   - workflow_dispatch ONLY: no automatic runs; widening the triggers is an
#     explicit owner decision (AGENTS.md).
#   - contents: read only; credentials are not persisted; production signing
#     credentials never enter CI; nothing is published, merged or tagged.
#     The debug APK is signed only with the runner's throwaway debug keystore.
#   - Every adb use resolves and exports a single explicit `emulator-NNNN`
#     serial and verifies `ro.kernel.qemu=1`; a physical device can never be
#     selected (multiple attached devices abort the run).
#   - Actions are pinned to full commit SHAs (the exact pins already proven by
#     runs 39518973833 / 39552116455 / 39557624554).
#   - The job records and asserts `git rev-parse HEAD == GITHUB_SHA` into the
#     uploaded evidence, so screenshots are bound to the exact dispatched
#     commit.
#   - No instrumentation tests are re-run here (5.10/5.11 already passed in
#     run 39557624554; the owner's standing rule is not to rerun successful CI
#     jobs). This job only boots the emulator, installs the candidate, drives
#     the real UI and captures screencaps.
#
# How themes are switched (no test-only hooks, no weakened product paths):
#   The theme is the product's own persisted setting —
#   `profile_settings.theme` in Room (`opus.db`), validated by
#   ProfileViewModel.theme() to one of "System"/"Light"/"Dark". The script
#   force-stops the app, updates that single column through `run-as` + the
#   system `sqlite3` (debug APK is run-as-able), asserts the readback, and
#   relaunches. The app then renders through its normal startup path. The DB
#   lives only on the disposable CI emulator; no owner data is ever involved.
#
# Capture set (12 screencaps): Home, Repertoire, Discover, Practice, Profile
# (the five real bottom-navigation tabs of this branch) plus the Settings
# screen (top-right entry from Profile) — each in Ivory and Nocturne.
#
# Honest scope: these are VISUAL artifacts for owner inspection. The script
# asserts device identity, install success, theme readback and non-trivial
# PNG sizes; it does not assert pixel content. No Stage 5 claim is made from
# this job alone.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage5-screenshots-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage5-screenshots:
    name: "5.11 screenshots — API 36 emulator, Ivory + Nocturne"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Record verified source commit
        run: |
          mkdir -p stage5-screenshots
          CHECKED_OUT="$(git rev-parse HEAD)"
          {
            echo "github.sha: $GITHUB_SHA"
            echo "github.ref: $GITHUB_REF"
            echo "checkout HEAD: $CHECKED_OUT"
          } | tee stage5-screenshots/source-commit.txt
          if [ "$CHECKED_OUT" != "$GITHUB_SHA" ]; then
            echo "ERROR: checked-out commit does not match the dispatched commit"; exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up required Android SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the candidate debug APK (no tests are re-run)
        run: ./gradlew --no-daemon --max-workers=1 assembleDebug
      - name: Materialize screenshot script (the action's script input runs line-by-line)
        run: |
            # android-emulator-runner@v2.38.0 parseScript() splits its `script`
            # input into single lines and runs each via a separate `sh -c`
            # (source-inspected; proven by runs 39503450845 and 39508388525).
            # GitHub `run:` steps execute as ONE bash process, so the approved
            # script is materialized into a file here, syntax-checked, and later
            # executed as a single-line `bash <file>` (same pattern as the green
            # stage5-emulator.yml).
            cat > "$RUNNER_TEMP/stage5-screenshots.sh" <<'BASH_SCRIPT'
            set -euo pipefail
            SERIAL="$(adb devices | awk '$2=="device" && $1 ~ /^emulator-/ {print $1; exit}')"
            case "$SERIAL" in emulator-[0-9]*) : ;; *) echo "ERROR: no identified emulator-NNNN serial"; adb devices; exit 1 ;; esac
            ATTACHED="$(adb devices | awk '$2=="device"' | wc -l)"
            if [ "$ATTACHED" -ne 1 ]; then echo "ERROR: expected exactly one attached device, found $ATTACHED"; adb devices; exit 1; fi
            QEMU="$(adb -s "$SERIAL" shell getprop ro.kernel.qemu | tr -d '\r')"
            if [ "$QEMU" != "1" ]; then echo "ERROR: $SERIAL is not a verified emulator (ro.kernel.qemu=$QEMU)"; exit 1; fi
            export ANDROID_SERIAL="$SERIAL"
            echo "Capturing screenshots on verified emulator $SERIAL"
            mkdir -p stage5-screenshots/png
            trap 'adb -s "$SERIAL" logcat -d > stage5-screenshots/logcat.txt 2>/dev/null || true' EXIT

            adb shell wm size   | tee stage5-screenshots/wm-size.txt
            adb shell wm density | tee stage5-screenshots/wm-density.txt

            echo "Installing the candidate debug APK"
            adb install -r app/build/outputs/apk/debug/app-debug.apk | tee stage5-screenshots/install.txt

            # Locate a UI node by exact text or content-description and tap its
            # center. Uses the real accessibility tree (Compose exposes
            # semantics), so navigation goes through the product's own UI.
            cat > "$RUNNER_TEMP/find_and_tap.py" <<'PYEOF'
            import re, subprocess, sys
            label, attr = sys.argv[1], sys.argv[2]  # attr: text | content-desc
            subprocess.run(['adb', 'shell', 'uiautomator', 'dump', '/sdcard/window_dump.xml'],
                           check=True, capture_output=True)
            xml = subprocess.run(['adb', 'shell', 'cat', '/sdcard/window_dump.xml'],
                                 check=True, capture_output=True, text=True).stdout
            # bounds="[x1,y1][x2,y2]" on the node carrying the exact attribute value
            pat = re.compile(r'<node[^>]*' + re.escape(attr) + r'="' + re.escape(label) +
                             r'"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"')
            m = pat.search(xml)
            if not m:
                # attribute order in the dump may put bounds before the match
                pat2 = re.compile(r'<node[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"[^>]*' +
                                  re.escape(attr) + r'="' + re.escape(label) + r'"')
                m = pat2.search(xml)
            if not m:
                print(f'ERROR: no node with {attr}="{label}"'); sys.exit(41)
            x1, y1, x2, y2 = map(int, m.groups())
            cx, cy = (x1 + x2) // 2, (y1 + y2) // 2
            print(f'tapping {attr}="{label}" at ({cx},{cy})')
            subprocess.run(['adb', 'shell', 'input', 'tap', str(cx), str(cy)], check=True)
            PYEOF
            tap() { python3 "$RUNNER_TEMP/find_and_tap.py" "$1" "$2"; }
            tap_if_present() {
              if python3 "$RUNNER_TEMP/find_and_tap.py" "$1" "$2" >/dev/null 2>&1; then return 0; fi
              echo "optional node $2=\"$1\" not present — continuing"; return 0
            }
            focus() { adb shell dumpsys window | grep -m1 mCurrentFocus || true; }

            launch() {
              adb shell am force-stop com.opus.piano
              sleep 1
              adb shell am start -W -n com.opus.piano/.MainActivity | tee -a stage5-screenshots/launch.txt
              sleep 4   # first-frame + catalog seed settle
              focus | tee -a stage5-screenshots/launch.txt
              # A fresh install shows the onboarding dialog — dismiss it through
              # its own Skip button so the real screens are visible.
              tap_if_present "Skip" text
              sleep 2
            }

            prime_app() {
              # Run 39571926478 failed here: databases/opus.db does not exist
              # until the app's FIRST launch (Room creates it on startup), so a
              # theme write before any launch aborts with "unable to open
              # database file". Launch once first — this also lets onboarding be
              # dismissed before any themed capture.
              launch
              adb shell am force-stop com.opus.piano
              sleep 1
              test "$(adb shell run-as com.opus.piano ls databases | tr -d '\r' | grep -c '^opus.db$')" = "1" \
                || { echo "ERROR: opus.db was not created by the first launch"; exit 44; }
              test "$(sql "SELECT count(*) FROM sqlite_master WHERE type='table' AND name='profile_settings'" | tail -n1 | tr -d '\r')" = "1" \
                || { echo "ERROR: profile_settings table missing from opus.db"; exit 45; }
              echo "primed: opus.db + profile_settings exist after first launch" | tee stage5-screenshots/prime.txt
            }

            # Runs one SQL statement against the app's own Room DB through
            # stdin. Run 39572917657 failed with sqlite "in prepare, incomplete
            # input": passing the SQL as a quoted adb-shell argument does not
            # survive the DEVICE shell re-parse (argv is joined with spaces
            # before the device shell splits it again, so sqlite received only
            # the bare `UPDATE`). Piping the statement on stdin is immune to
            # any shell re-parsing on either side.
            sql() { printf '%s\n' "$1" | adb shell "run-as com.opus.piano sqlite3 -batch databases/opus.db"; }

            set_theme() {
              # The product's own persistence (ProfileSettings.theme in opus.db).
              adb shell am force-stop com.opus.piano
              sleep 1
              sql "UPDATE profile_settings SET theme='$1' WHERE id=1"
              READBACK="$(sql "SELECT theme FROM profile_settings WHERE id=1" | tail -n1 | tr -d '\r')"
              echo "theme readback after write: '$READBACK' (expected '$1')" \
                | tee stage5-screenshots/theme-readback.txt
              if [ "$READBACK" != "$1" ]; then
                echo "ERROR: theme readback '$READBACK' != expected '$1'"; exit 42
              fi
            }

            capture() {
              PREFIX="$1"; LABEL="$2"; ATTR="$3"
              if [ "$ATTR" = "nav" ]; then
                tap "$LABEL" text
              else
                tap "$LABEL" content-desc
              fi
              sleep 2.5   # navigation animation + content settle
              OUT="stage5-screenshots/png/${PREFIX}-$(echo "$LABEL" | tr 'A-Z ' 'a-z_').png"
              adb exec-out screencap -p > "$OUT"
              SIZE="$(wc -c < "$OUT")"
              echo "captured $OUT ($SIZE bytes)"
              # A real screen render of a 1080x2400 display is hundreds of KB;
              # a black/blank frame is tiny. Guard against empty captures.
              if [ "$SIZE" -lt 20000 ]; then
                echo "ERROR: $OUT is implausibly small ($SIZE bytes) — blank capture?"; exit 43
              fi
            }

            capture_theme() {
              PREFIX="$1"
              launch
              for TAB in Home Repertoire Discover Practice Profile; do
                capture "$PREFIX" "$TAB" nav
              done
              # Profile tab is current; Settings is the top-right icon entry.
              capture "$PREFIX" "Settings" settings
            }

            echo "=== Priming (first launch creates the Room DB; onboarding dismissed) ==="
            prime_app
            echo "=== Ivory (theme=Light) ==="
            set_theme "Light"
            capture_theme "ivory"
            echo "=== Nocturne (theme=Dark) ==="
            set_theme "Dark"
            capture_theme "nocturne"

            # Leave the disposable emulator tidy and record the evidence set.
            set_theme "System"
            (cd stage5-screenshots/png && sha256sum *.png) | tee stage5-screenshots/png-sha256.txt
            ls -la stage5-screenshots/png | tee stage5-screenshots/capture-manifest.txt
            adb shell dumpsys window | grep -m1 mCurrentFocus | tee -a stage5-screenshots/capture-manifest.txt
            echo "SCREENSHOT CAPTURE COMPLETE"
            BASH_SCRIPT
            bash -n "$RUNNER_TEMP/stage5-screenshots.sh"
            echo "Materialized and syntax-checked $RUNNER_TEMP/stage5-screenshots.sh"
      - name: Capture screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: stage5-ci
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash "$RUNNER_TEMP/stage5-screenshots.sh"
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage5-screenshots
          path: |
            stage5-screenshots/**
          if-no-files-found: warn
          retention-days: 30
