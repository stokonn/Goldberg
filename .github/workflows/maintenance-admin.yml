name: Gould maintenance administration regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  administration-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run non-destructive administration regressions
        run: |
          python3 -m unittest discover -s scripts -p test_finalize_github.py
          python3 -m unittest discover -s scripts -p test_finish_maintenance_admin.py
          python3 -m unittest discover -s scripts -p test_maintenance_admin_safety.py
# Every Git/GitHub effect in controller integration tests is mocked.
# No live controller operation, account secret, deployment or publication.
